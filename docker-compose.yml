services:
  redis:
    image: redis:latest
    container_name: graysky-redis
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: graysky-push-notifs
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
